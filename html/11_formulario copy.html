<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo de Formulario Simple</title>
</head>
<body>
    <h2>Ejemplo de Formulario Simple</h2>

    <form action="procesar" method="post">
        <p>Formulario de Datos</p>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <br><br>

        <label for="correo">Correo Electrónico:</label>
        <input type="email" id="correo" name="correo">
        <br><br>

        <label for="fecha">Fecha de Nacimiento:</label>
        <input type="date" id="fecha" name="fecha">
        <br><br>

        <label for="color">Color Favorito:</label>
        <input type="color" id="color" name="color">
        <br><br>

        <label>Género:</label>
        <input type="radio" id="m" name="genero" value="M">
        <label for="m">Masculino</label>

        <input type="radio" id="f" name="genero" value="F">
        <label for="f">Femenino</label>
        <br><br>

        <label for="pais">País:</label>
        <select id="pais" name="pais">
            <option value="">Seleccione ...</option>
            <option value="ec">Ecuador</option>
            <option value="me">México</option>
            <option value="co">Colombia</option>
            <option value="ar">Argentina</option>
        </select>
        <br><br>

        <input type="checkbox" id="terminos" name="terminos">
        <label for="terminos">Acepto los términos y condiciones</label>
        <br><br>

        <input type="submit" value="Enviar">
    </form>
</body>
</html>
